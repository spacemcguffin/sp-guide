<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#10131d" name="theme-color"/>
<meta name="robots" content="noindex, follow"/>
<title>404 Page Not Found - South Park Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/southpark.css">
<link rel="stylesheet" href="/css/article.css">

<style>
/* 404 page */
.not-found{
  width:100%;
  min-height:calc(100vh - 240px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:72px 20px 92px;
  background:#F8F8F8;
  color:var(--ink);
  text-align:center;
}

.not-found-inner{
  width:min(860px,100%);
  margin:auto;
}

.not-found-code{
  margin:0 0 8px;
  color:var(--ink);
  font-size:clamp(7.5rem,18vw,13rem);
  font-weight:850;
  line-height:.78;
  letter-spacing:-.07em;
}

.not-found h1{
  margin:0;
  color:var(--ink);
  font-size:clamp(2.9rem,6vw,5.5rem);
  font-weight:750;
  line-height:1;
  letter-spacing:-.035em;
  text-transform:uppercase;
  text-wrap:balance;
}

.not-found p{
  max-width:680px;
  margin:24px auto 0;
  color:rgba(23,34,51,.68);
  font-family:"Inter",Arial,sans-serif;
  font-size:1.06rem;
  line-height:1.7;
}

.not-found-paper{
  width:max-content;
  max-width:90%;
  margin:34px auto 28px;
  padding:16px 24px 15px;
  background:#eadb8f;
  color:rgba(23,34,51,.88);
  font-size:.83rem;
  font-weight:850;
  line-height:1.2;
  letter-spacing:.07em;
  text-transform:uppercase;
  box-shadow:0 4px 10px rgba(23,34,51,.08);
  transform:rotate(-1.1deg);
  clip-path:polygon(
    0 8%,7% 2%,15% 5%,24% 1%,34% 4%,44% 0,
    55% 4%,65% 1%,76% 5%,87% 2%,100% 6%,
    98% 22%,100% 38%,98% 54%,100% 70%,98% 86%,100% 96%,
    89% 99%,78% 96%,67% 100%,56% 97%,45% 100%,
    34% 96%,23% 99%,12% 96%,1% 100%,
    2% 83%,0 66%,2% 49%,0 32%,2% 17%
  );
}

.not-found-paper-line + .not-found-paper-line{
  margin-top:3px;
}

.not-found-cta{
  min-height:48px;
  padding:0 22px;
  transform:rotate(-.35deg);
}

.not-found-cta:hover{
  transform:rotate(-.35deg) translateY(-2px);
}

.not-found-chevron{
  width:14px;
  height:14px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .18s ease;
}

.not-found-cta:hover .not-found-chevron{
  transform:translateX(-2px);
}

@media(max-width:760px){
  .not-found{
    min-height:calc(100vh - 205px);
    padding:54px 20px 72px;
  }

  .not-found-code{
    font-size:clamp(6rem,33vw,9rem);
  }

  .not-found h1{
    font-size:clamp(2.35rem,12vw,3.5rem);
  }

  .not-found p{
    margin-top:18px;
    font-size:1rem;
    line-height:1.6;
  }

  .not-found-paper{
    margin:28px auto 24px;
    padding:14px 20px 13px;
    font-size:.73rem;
  }
}
</style>

<script src="/js/site.js" defer></script>
</head>
<body id="top">
<div id="site-header"></div>
<main>
<section class="not-found">
<div class="not-found-inner">
<div class="not-found-code" aria-hidden="true">404</div>
<h1>Page Not Found</h1>
  
<p>The page you’re looking for doesn’t exist, or it may have been moved.</p>

  <br><br>


<a class="paper-cta not-found-cta" href="/">
<svg class="not-found-chevron" aria-hidden="true" viewBox="0 0 24 24">
<path d="M15 5L8 12L15 19"/>
</svg>
<span>Back to South Park</span>
</a>
</div>
</section>
</main>

<div id="site-footer"></div>
</body>
</html>
