<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11141d">
<title>News Archive | South Park Guide</title>
<meta name="description" content="Browse all South Park news and announcements.">
<link rel="canonical" href="https://southpark.guide/news/">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/southpark.css">
<link rel="stylesheet" href="/css/news-archive.css">
<script src="/js/site.js" defer></script>
<script src="/js/news-archive.js" defer></script>
</head><body id="top" class="news-archive-page">
<div id="site-header"></div>
<main><section class="section" id="news" aria-labelledby="newsArchiveHeading">
<div class="section-title-row"><h2 id="newsArchiveHeading">News Archive</h2></div>
<div class="archive-toolbar">
  <div class="archive-search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
    <input id="archiveSearch" type="search" placeholder="Search the archive..." aria-label="Search news articles" autocomplete="off">
    <button id="archiveClear" class="archive-clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <label class="archive-sort-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 4-4 4 4M7 4v16M21 16l-4 4-4-4m4 4V4"/></svg><select id="archiveSort" aria-label="Sort news articles"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">Title A–Z</option></select></label>
</div>
<p class="archive-status" id="archiveStatus" role="status" aria-live="polite">Loading articles…</p>
<div class="news-grid" id="archiveGrid"></div>
<nav class="news-pagination archive-pages" id="archivePages" aria-label="News pagination"></nav>
</section></main><div id="site-footer"></div>
</body></html>
