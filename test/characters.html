<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#041029"><title>Character Guide - South Park Guide</title><meta name="description" content="Explore the characters of South Park."><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap"><style>

/* =========================================================
   ROOT
========================================================= */

:root {
  --yellow: #f5b041;

  --glass:
    rgba(255,255,255,0.09);

  --glass-strong:
    rgba(255,255,255,0.14);

  --glass-border:
    rgba(255,255,255,0.17);

  --glass-border-hover:
    rgba(255,255,255,0.3);

  --text:
    rgba(255,255,255,0.96);

  --text-soft:
    rgba(255,255,255,0.66);

  --text-faint:
    rgba(255,255,255,0.4);
}

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background-color: #20253d;
}

body {
  min-height: 100vh;

  font-family: "Google Sans Flex", sans-serif;

  color: var(--text);

  background-color: #20253d;

  background-image:
    radial-gradient(
      circle at 20% 20%,
      rgba(109,135,255,0.14),
      transparent 30%
    ),

    radial-gradient(
      circle at 80% 70%,
      rgba(205,116,255,0.12),
      transparent 28%
    ),

    linear-gradient(
      rgba(8,11,24,0.24),
      rgba(8,11,24,0.58)
    ),

    url("/images/nebula.png");

  background-size: cover;
  background-position: center top;
  background-attachment: fixed;

  overflow-x: hidden;
}

body.modal-open {
  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--yellow);
  color: #111;
}

/* =========================================================
   PAGE
========================================================= */

.page {
  width: 100%;

  padding:
    55px
    28px
    80px;
}

.site-shell {
  width: min(1180px, 100%);
  margin: 0 auto;
}

/* =========================================================
   GLASS UTILITY
========================================================= */

.glass {
  border:
    1px solid
    var(--glass-border);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.055)
    );

  box-shadow:
    0 22px 65px rgba(0,0,0,0.2),
    inset 0 1px 0 rgba(255,255,255,0.13);

  backdrop-filter:
    blur(22px)
    saturate(135%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(135%);
}

/* =========================================================
   HERO
========================================================= */

.hero {
  position: relative;

  padding:
    24px
    28px
    26px;

  border-radius: 24px;

  overflow: hidden;
}

.hero::before {
  content: "";

  position: absolute;

  width: 300px;
  height: 190px;

  left: -120px;
  top: -120px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.14),
      transparent 68%
    );

  pointer-events: none;
}

.hero-topline {
  position: relative;
  z-index: 1;

  display: flex;
  align-items: center;
  gap: 10px;

  margin-bottom: 9px;

  color: var(--text-soft);

  font-size: 0.66rem;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 0.16em;
}

.hero-topline::before {
  content: "";

  width: 20px;
  height: 2px;

  border-radius: 100px;

  background: var(--yellow);
}

.hero h1 {
  position: relative;
  z-index: 1;

  max-width: 680px;

  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      2.55rem,
      5.2vw,
      4.75rem
    );

  font-weight: 620;

  line-height: 0.88;

  letter-spacing: -0.065em;
}

.hero h1 span {
  position: relative;
  display: inline-block;
}

.hero h1 span::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: -8px;

  height: 4px;

  border-radius: 50%;

  background: var(--yellow);

  transform: rotate(-1deg);
}

.hero-description {
  position: relative;
  z-index: 1;

  max-width: 650px;

  margin-top: 21px;

  color: var(--text-soft);

  font-size: 0.9rem;
  line-height: 1.65;
}

.hero-stats {
  position: relative;
  z-index: 1;

  display: flex;
  flex-wrap: wrap;

  gap: 9px;

  margin-top: 20px;
}

.stat-pill {
  padding:
    8px
    11px;

  border:
    1px solid
    rgba(255,255,255,0.13);

  border-radius: 999px;

  background:
    rgba(255,255,255,0.06);

  color:
    rgba(255,255,255,0.62);

  font-size: 0.65rem;
  font-weight: 650;

  letter-spacing: 0.07em;

  text-transform: uppercase;

  backdrop-filter: blur(10px);
}

/* =========================================================
   SECTION BASICS
========================================================= */

.section {
  margin-top: 58px;
}

.section-heading {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  gap: 20px;

  margin-bottom: 19px;
}

.section-kicker {
  margin-bottom: 6px;

  color: var(--yellow);

  font-size: 0.62rem;
  font-weight: 700;

  letter-spacing: 0.16em;

  text-transform: uppercase;
}

.section-title {
  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      1.8rem,
      4vw,
      2.65rem
    );

  font-weight: 590;

  line-height: 1;

  letter-spacing: -0.04em;
}

.section-description {
  max-width: 430px;

  color:
    var(--text-faint);

  font-size: 0.76rem;
  line-height: 1.45;

  text-align: right;
}

/* =========================================================
   BROWSE TOOLBAR
========================================================= */

.browse-panel {
  padding:
    18px;

  border-radius: 24px;
}

.toolbar {
  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap: 12px;

  align-items: center;
}

.search-wrap {
  position: relative;
}

.search-icon {
  position: absolute;

  left: 16px;
  top: 50%;

  transform: translateY(-50%);

  pointer-events: none;

  color:
    rgba(255,255,255,0.45);

  font-size: 1rem;
}

.search-input {
  width: 100%;

  height: 50px;

  padding:
    0
    18px
    0
    43px;

  border:
    1px solid
    rgba(255,255,255,0.14);

  border-radius: 15px;

  outline: none;

  background:
    rgba(255,255,255,0.065);

  color: #fff;

  font-size: 0.86rem;

  backdrop-filter:
    blur(12px);

  transition:
    border-color 0.25s ease,
    background 0.25s ease;
}

.search-input::placeholder {
  color:
    rgba(255,255,255,0.35);
}

.search-input:focus {
  border-color:
    rgba(255,255,255,0.34);

  background:
    rgba(255,255,255,0.09);
}

.random-button {
  height: 50px;

  padding:
    0
    19px;

  border:
    1px solid
    rgba(255,255,255,0.15);

  border-radius: 15px;

  background:
    rgba(255,255,255,0.08);

  color:
    rgba(255,255,255,0.85);

  cursor: pointer;

  font-size: 0.68rem;
  font-weight: 700;

  letter-spacing: 0.08em;

  text-transform: uppercase;

  transition:
    background 0.25s ease,
    color 0.25s ease,
    transform 0.25s ease;
}

.random-button:hover {
  transform:
    translateY(-2px);

  background: var(--yellow);

  color: #111;
}

/* =========================================================
   SEASON RAIL
========================================================= */

.season-area {
  margin-top: 16px;
}

.season-label {
  margin-bottom: 9px;

  color:
    var(--text-faint);

  font-size: 0.59rem;
  font-weight: 700;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}

.season-rail {
  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 3px;

  scrollbar-width: none;
}

.season-rail::-webkit-scrollbar {
  display: none;
}

.season-button {
  flex: 0 0 auto;

  min-width: 42px;

  height: 38px;

  padding:
    0
    12px;

  border:
    1px solid
    rgba(255,255,255,0.13);

  border-radius: 999px;

  background:
    rgba(255,255,255,0.055);

  color:
    rgba(255,255,255,0.55);

  cursor: pointer;

  font-size: 0.68rem;
  font-weight: 680;

  transition:
    background 0.25s ease,
    color 0.25s ease,
    border-color 0.25s ease,
    transform 0.25s ease;
}

.season-button:hover {
  transform:
    translateY(-1px);

  color: #fff;

  border-color:
    rgba(255,255,255,0.28);
}

.season-button.active {
  color: #111;

  background: var(--yellow);

  border-color: var(--yellow);
}

/* =========================================================
   ACTIVE FILTERS
========================================================= */

.active-filters {
  display: none;
  position: sticky;
  top: 14px;
  z-index: 80;

  align-items: center;
  flex-wrap: wrap;
  gap: 7px;

  margin-top: 12px;
  padding: 10px 12px;

  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      rgba(30,35,58,0.88),
      rgba(18,22,40,0.78)
    );

  box-shadow:
    0 14px 38px rgba(0,0,0,0.24),
    inset 0 1px 0 rgba(255,255,255,0.12);

  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
}

.active-filters.visible {
  display: flex;
}

.active-filters-label {
  margin-right: 2px;

  color: var(--text-faint);

  font-size: 0.56rem;
  font-weight: 700;

  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.active-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  min-height: 29px;
  padding: 0 9px 0 10px;

  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 999px;

  background: rgba(255,255,255,0.065);
  color: rgba(255,255,255,0.72);

  cursor: pointer;

  font-size: 0.61rem;
  font-weight: 650;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease;
}

.active-filter-chip:hover {
  background: rgba(255,255,255,0.11);
  border-color: rgba(255,255,255,0.24);
  color: #fff;
}

.active-filter-chip .filter-x {
  color: rgba(255,255,255,0.42);
  font-size: 0.82rem;
  line-height: 1;
}

.clear-active-filters {
  margin-left: auto;

  border: 0;
  background: transparent;

  color: rgba(255,255,255,0.42);

  cursor: pointer;

  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;

  transition: color 0.2s ease;
}

.clear-active-filters:hover {
  color: #fff;
}

/* =========================================================
   RESULTS STATUS
========================================================= */

.results-line {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin:
    28px
    2px
    0;

  color:
    var(--text-faint);

  font-size: 0.67rem;

  letter-spacing: 0.06em;

  text-transform: uppercase;
}

/* =========================================================
   ARCHIVE
========================================================= */

.archive {
  margin-top: 35px;
}

.season-section {
  margin-bottom: 62px;

  animation:
    revealSeason
    0.35s
    ease
    both;
}

@keyframes revealSeason {

  from {
    opacity: 0;
    transform:
      translateY(8px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}

.season-header {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  gap: 25px;

  padding-bottom: 14px;

  margin-bottom: 18px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.1);
}

.season-name {
  font-family: "Google Sans Flex", sans-serif;

  font-size:
    clamp(
      1.65rem,
      4vw,
      2.25rem
    );

  font-weight: 580;

  letter-spacing: -0.04em;
}

.season-year {
  margin-top: 5px;

  color:
    var(--text-faint);

  font-size: 0.64rem;
  font-weight: 650;

  letter-spacing: 0.09em;

  text-transform: uppercase;
}

.season-count {
  color:
    var(--text-faint);

  font-size: 0.62rem;
  font-weight: 650;

  letter-spacing: 0.08em;

  text-transform: uppercase;
}

/* =========================================================
   EPISODE GRID
========================================================= */

.episode-grid {
  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap: 16px;
}

.episode-card {
  position: relative;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,0.14);

  border-radius: 19px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.095),
      rgba(255,255,255,0.045)
    );

  box-shadow:
    0 16px 38px rgba(0,0,0,0.14),
    inset 0 1px 0 rgba(255,255,255,0.09);

  backdrop-filter:
    blur(18px)
    saturate(125%);

  cursor: pointer;

  transition:
    transform 0.35s cubic-bezier(.2,.8,.2,1),
    border-color 0.3s ease,
    background 0.3s ease;
}

.episode-card:hover {
  transform: none;

  border-color:
    rgba(255,255,255,0.28);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.13),
      rgba(255,255,255,0.06)
    );
}

.grid-image {
  position: relative;

  margin:
    8px
    8px
    0;

  border-radius: 13px;

  overflow: hidden;
}

.grid-image img {
  display: block;

  width: 100%;

  object-fit: cover;

  transition:
    transform 0.55s
    cubic-bezier(.2,.8,.2,1);
}

.episode-card:hover
.grid-image img {
  transform: scale(1.04);
}

.grid-image::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(5,7,15,0.3),
      transparent 56%
    );
}

.grid-number {
  position: absolute;

  z-index: 2;

  left: 9px;
  top: 9px;
  right: auto;
  bottom: auto;

  padding:
    5px
    7px;

  border-radius: 999px;

  border:
    1px solid
    rgba(255,255,255,0.2);

  background:
    rgba(8,10,20,0.55);

  color: #fff;

  font-size: 0.55rem;
  font-weight: 700;

  letter-spacing: 0.07em;

  backdrop-filter:
    blur(10px);
}

.grid-copy {
  padding:
    13px
    15px
    16px;
}

.grid-title {
  margin-bottom: 7px;
   text-wrap: balance;

  font-family: "Google Sans Flex", sans-serif;

  font-size: 1.2rem;
  font-weight: 570;

  line-height: 1.15;

  letter-spacing: -0.02em;
}

.grid-date {
  color:
    var(--text-faint);

  font-size: 0.58rem;
  font-weight: 650;

  letter-spacing: 0.075em;

  text-transform: uppercase;
}

/* =========================================================
   EMPTY RESULTS
========================================================= */

.empty-state {
  padding:
    60px
    25px;

  border:
    1px solid
    rgba(255,255,255,0.12);

  border-radius: 22px;

  background:
    rgba(255,255,255,0.045);

  text-align: center;

  color:
    var(--text-soft);

  backdrop-filter:
    blur(15px);
}

.empty-state strong {
  display: block;

  margin-bottom: 7px;

  color: #fff;

  font-family: "Google Sans Flex", sans-serif;

  font-size: 1.3rem;

  font-weight: 580;
}

/* =========================================================
   MODAL
========================================================= */

.episode-modal {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 28px;

  visibility: hidden;
  opacity: 0;

  background:
    rgba(5,7,16,0.58);

  backdrop-filter:
    blur(22px)
    saturate(125%);

  transition:
    visibility 0.35s ease,
    opacity 0.35s ease;
}

.episode-modal.active {
  visibility: visible;
  opacity: 1;
}

.modal-panel {
  position: relative;

  width:
    min(
      930px,
      100%
    );

  max-height:
    calc(
      100vh
      -
      56px
    );

  overflow-y: auto;

  border:
    1px solid
    rgba(255,255,255,0.2);

  border-radius: 28px;

  color: #fff;

  background:
    linear-gradient(
      145deg,
      rgba(34,39,64,0.9),
      rgba(18,22,40,0.84)
    );

  box-shadow:
    0 45px 130px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.16);

  backdrop-filter:
    blur(26px)
    saturate(130%);

  transform:
    translateY(20px)
    scale(0.98);

  opacity: 0;

  transition:
    transform 0.4s cubic-bezier(.2,.8,.2,1),
    opacity 0.35s ease;
}

.episode-modal.active
.modal-panel {
  transform:
    translateY(0)
    scale(1);

  opacity: 1;
}

/* =========================================================
   MODAL CLOSE
========================================================= */

.modal-close {
  position: absolute;

  z-index: 10;

  right: 17px;
  top: 17px;

  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border:
    1px solid
    rgba(255,255,255,0.24);

  border-radius: 50%;

  background:
    rgba(12,14,26,0.48);

  color: #fff;

  font-size: 1.2rem;

  cursor: pointer;

  backdrop-filter:
    blur(14px);

  transition:
    transform 0.25s ease,
    background 0.25s ease,
    color 0.25s ease;
}

.modal-close:hover {
  transform: scale(1.07);

  background:
    rgba(255,255,255,0.92);

  color: #111;
}

/* directional episode-change motion is applied with the Web Animations API */
.modal-scroll {
  will-change: transform, opacity;
}

/* =========================================================
   MODAL HERO
========================================================= */

.modal-image {
  position: relative;

  height:
    clamp(
      320px,
      48vw,
      500px
    );

  overflow: hidden;

  border-radius:
    27px
    27px
    0
    0;
}

.modal-image img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transform: scale(1.02);

  transition:
    transform 0.75s
    cubic-bezier(.2,.8,.2,1);
}

.episode-modal.active
.modal-image img {
  transform: scale(1);
}

.modal-image::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(12,15,28,0.98),
      rgba(12,15,28,0.28) 42%,
      transparent 70%
    );
}

.modal-image-copy {
  position: absolute;

  z-index: 2;

  left: 30px;
  right: 80px;

  bottom: 27px;
}

.modal-episode {
  margin-bottom: 8px;

  color:
    rgba(255,255,255,0.65);

  font-size: 0.68rem;
  font-weight: 700;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}

.modal-title {
  font-family: "Google Sans Flex", sans-serif;
   text-wrap: balance;
   text-shadow: 0 4px 24px rgba(0, 0, 0, .6);

  font-size:
    clamp(
      2.2rem,
      6vw,
      4rem
    );

  font-weight: 620;

  line-height: 0.94;

  letter-spacing: -0.055em;
}

/* =========================================================
   MODAL BODY
========================================================= */

.modal-content {
  padding:
    28px
    31px
    31px;
}

.modal-info-row {
  display: flex;
  flex-wrap: wrap;

  gap: 9px;

  margin-bottom: 23px;
}

.modal-info {
  padding:
    9px
    12px;

  border:
    1px solid
    rgba(255,255,255,0.13);

  border-radius: 11px;

  background:
    rgba(255,255,255,0.065);

  color:
    rgba(255,255,255,0.65);

  font-size: 0.64rem;
  font-weight: 650;

  letter-spacing: 0.07em;

  text-transform: uppercase;
}

.modal-description {
  max-width: 760px;

  color:
    rgba(255,255,255,0.73);

  font-size: 1rem;
  line-height: 1.7;
}

/* =========================================================
   MODAL NAV
========================================================= */

.modal-navigation {
  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 12px;

  margin-top: 31px;

  padding-top: 22px;

  border-top:
    1px solid
    rgba(255,255,255,0.09);
}

.modal-nav {
  min-height: 67px;

  display: flex;
  align-items: center;

  gap: 11px;

  padding:
    11px
    13px;

  border:
    1px solid
    rgba(255,255,255,0.12);

  border-radius: 14px;

  background:
    rgba(255,255,255,0.055);

  cursor: pointer;

  text-align: left;

  transition:
    background 0.25s ease,
    transform 0.25s ease,
    border-color 0.25s ease;
}

.modal-nav:hover {
  transform:
    translateY(-2px);

  background:
    rgba(255,255,255,0.09);

  border-color:
    rgba(255,255,255,0.22);
}

.modal-nav:disabled,
.modal-top-arrow:disabled {
  opacity: 0.28;
  cursor: default;
  pointer-events: none;
  transform: none;
}

.modal-nav:disabled {
  background: rgba(255,255,255,0.025);
  border-color: rgba(255,255,255,0.07);
}

.modal-nav:disabled .nav-title,
.modal-nav:disabled .nav-label,
.modal-nav:disabled .nav-circle {

}

.modal-nav.next {

  text-align: right;

  width: 35px;
  height: 35px;

  display: grid;
  place-items: center;

    1px solid

.nav-title {

  font-size: 0.88rem;
  font-weight: 570;

/* =========================================================
   MODAL TOP BAR + SAFE INNER SCROLL
========================================================= */

.modal-panel {
  height: min(760px, calc(100vh - 56px));
  max-height: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-topbar {
  position: relative;
  z-index: 20;
  flex: 0 0 54px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid rgba(255,255,255,0.09);
  background: rgba(18,22,40,0.58);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.modal-topbar > .modal-top-arrow:first-child {
  justify-self: start;
}

.modal-topbar-actions {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-counter {
  min-width: 80px;
  text-align: center;
  color: rgba(255,255,255,0.52);
  font-size: 0.65rem;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.modal-counter strong {
  color: #fff;
  font-weight: 760;
}

.modal-top-arrow,
.modal-topbar .modal-close {
  position: static;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: 50%;
  background: rgba(255,255,255,0.045);
  color: rgba(255,255,255,0.62);
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: none;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: transform .22s ease, background .22s ease, color .22s ease, border-color .22s ease;
}

.modal-top-arrow:hover {
  transform: translateY(-1px);
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
}

.modal-topbar .modal-close:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.9);
  border-color: rgba(255,255,255,0.9);
  color: #111;
}

.modal-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}

.modal-scroll::-webkit-scrollbar {
  width: 10px;
}

.modal-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.modal-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.22);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: 999px;
}

.modal-scroll::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.36);
  border: 3px solid transparent;
  background-clip: content-box;
}

.modal-image {
  border-radius: 0;
}

.season-tooltip {
  position: fixed;
  z-index: 400;
  left: 0;
  top: 0;
  padding: 9px 13px;
  border: 1px solid rgba(74,116,170,.45);
  border-radius: 11px;
  background: rgba(5,15,29,.96);
  box-shadow: 0 10px 28px rgba(0,0,0,.35);
  color: #eef5ff;
  font-size: .73rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%) translateY(-8px);
  transition: opacity .14s ease, transform .14s ease;
}

.season-tooltip.visible {
  opacity: 1;
  transform: translate(-50%, -100%) translateY(-11px);
}

.season-tooltip::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 8px;
  height: 8px;
  transform: translateX(-50%) rotate(45deg);
  border-right: 1px solid rgba(74,116,170,.45);
  border-bottom: 1px solid rgba(74,116,170,.45);
  background: rgba(5,15,29,.96);
}

}

.season-boundary-note {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 7px;
  margin-top: 15px;
  padding: 8px 10px;
  border: 1px solid color-mix(in srgb, var(--season-color, #58a8ff) 38%, transparent);
  border-radius: 10px;
  background:
    linear-gradient(
      90deg,
      color-mix(in srgb, var(--season-color, #58a8ff) 9%, transparent),
      rgba(255,255,255,.03)
    );
  color: rgba(255,255,255,.72);
  font-size: .67rem;
  font-weight: 720;
  letter-spacing: .06em;
  text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
.grid-image {
  background: rgba(255,255,255,.045);
}

.grid-image::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(
      110deg,
      rgba(255,255,255,.025) 25%,
      rgba(255,255,255,.11) 42%,
      rgba(255,255,255,.025) 60%
    );
  background-size: 220% 100%;
  animation: imageSkeleton 1.25s linear infinite;
  transition: opacity .25s ease;
}

.grid-image.loaded::before {
  opacity: 0;
  animation: none;
}

.grid-image img {
  position: relative;
  z-index: 1;
  opacity: 0;
  transition:
    opacity .28s ease,
    transform .55s cubic-bezier(.2,.8,.2,1);
}

.grid-image.loaded img {
  opacity: 1;
}

.grid-image::after,
.grid-number {
  z-index: 2;
}

@keyframes imageSkeleton {
  from { background-position: 160% 0; }
  to { background-position: -70% 0; }
}

@keyframes randomEpisodeWiggle {

  25%  { transform: rotate(-2deg) scale(.985); }
  55%  { transform: rotate(1.8deg) scale(1.025); }
  78%  { transform: rotate(-.7deg) scale(1.01); }
  100% { transform: rotate(0) scale(1); }
}

  0%   { transform: translateX(0) rotate(0); }
  45%  { transform: translateX(2px) rotate(8deg); }
  100% { transform: translateX(0) rotate(0); }
}

/* SOUTH PARK logo: tiny paper distress + subtly irregular letters */

    radial-gradient(circle at 72% 38%, transparent 0 .8px, #000 1.1px),
    radial-gradient(circle at 42% 76%, transparent 0 .9px, #000 1.2px),
    linear-gradient(#000, #000);
  mask-image:
    radial-gradient(circle at 18% 24%, transparent 0 1px, #000 1.35px),
    radial-gradient(circle at 72% 38%, transparent 0 .8px, #000 1.1px),
    radial-gradient(circle at 42% 76%, transparent 0 .9px, #000 1.2px),
    linear-gradient(#000, #000);
}

.guide-logo .logo-gap {
  display: inline-block;

}

.guide-logo > span:nth-child(1) { transform: rotate(-.38deg) translateY(.3px); }
.guide-logo > span:nth-child(2) { transform: rotate(.24deg) translateY(-.2px); }
.guide-logo > span:nth-child(3) { transform: rotate(-.16deg) translateY(.15px); }
.guide-logo > span:nth-child(4) { transform: rotate(.34deg) translateY(-.25px); }
.guide-logo > span:nth-child(5) { transform: rotate(-.22deg) translateY(.2px); }
.guide-logo > span:nth-child(7) { transform: rotate(.28deg) translateY(-.15px); }
.guide-logo > span:nth-child(8) { transform: rotate(-.31deg) translateY(.25px); }
.guide-logo > span:nth-child(9) { transform: rotate(.18deg) translateY(-.2px); }
.guide-logo > span:nth-child(10) { transform: rotate(-.26deg) translateY(.15px); }

/* SOUTH PARK logo — slightly more jagged handmade silhouette */
.guide-logo > span:not(.logo-gap) {
  clip-path: polygon(
    1% 2%, 13% 0%, 25% 2%, 38% .5%, 51% 2.2%, 64% .4%, 77% 2%, 89% .7%, 99% 2.5%,
    98.5% 14%, 100% 27%, 98.7% 40%, 100% 54%, 98.4% 67%, 100% 81%, 98% 98%,
    85% 99.2%, 72% 97.8%, 59% 99.5%, 46% 97.9%, 33% 99.4%, 20% 97.7%, 2% 99%,
    1.2% 85%, 0% 72%, 1.3% 59%, 0% 45%, 1.4% 31%, 0% 17%
  );
}

/* A touch more irregularity than the previous version, still restrained. */
.guide-logo > span:nth-child(1) { transform: rotate(-.62deg) translateY(.5px); }
.guide-logo > span:nth-child(2) { transform: rotate(.48deg) translateY(-.35px); }
.guide-logo > span:nth-child(3) { transform: rotate(-.34deg) translateY(.3px); }
.guide-logo > span:nth-child(4) { transform: rotate(.58deg) translateY(-.4px); }
.guide-logo > span:nth-child(5) { transform: rotate(-.44deg) translateY(.4px); }
.guide-logo > span:nth-child(7) { transform: rotate(.52deg) translateY(-.3px); }
.guide-logo > span:nth-child(8) { transform: rotate(-.57deg) translateY(.45px); }
.guide-logo > span:nth-child(9) { transform: rotate(.38deg) translateY(-.35px); }
.guide-logo > span:nth-child(10) { transform: rotate(-.49deg) translateY(.3px); }

/* SOUTH PARK logo — subtle letter jump on reset.
   Uses top/left rather than individual transform properties so it remains
   reliable on smaller/mobile browsers and preserves each letter's handmade transform. */
.guide-logo > span:not(.logo-gap) {
  position: relative;
}

.guide-logo.logo-jump > span:not(.logo-gap) {
  animation: logoLetterJumpA 320ms cubic-bezier(.2,.8,.2,1);
}

.guide-logo.logo-jump > span:nth-child(2n):not(.logo-gap) {
  animation-name: logoLetterJumpB;
  animation-delay: 14ms;
}

.guide-logo.logo-jump > span:nth-child(3n):not(.logo-gap) {
  animation-name: logoLetterJumpC;
  animation-delay: 26ms;
}

@keyframes logoLetterJumpA {
  0%, 100% { top: 0; left: 0; }
  36% { top: -4px; left: -1px; }
  68% { top: 1px; left: 1px; }
}

@keyframes logoLetterJumpB {
  0%, 100% { top: 0; left: 0; }
  34% { top: -3px; left: 1px; }
  66% { top: 1px; left: -1px; }
}

@keyframes logoLetterJumpC {
  0%, 100% { top: 0; left: 0; }
  38% { top: -5px; left: 0; }
  70% { top: 1px; left: 1px; }
}

@media (max-width: 760px) {
  .guide-logo.logo-jump > span:not(.logo-gap) {

}

</style></head><body><main class="page"><div class="site-shell"><header class="guide-hero"><div class="guide-hero-primary"><div class="guide-hero-copy"><a class="guide-back-link" href="/">Home</a><h1 class="guide-logo" id="guideLogoReset" role="button" tabindex="0" aria-label="Reset character guide"><span aria-hidden="true">S</span><span aria-hidden="true">O</span><span aria-hidden="true">U</span><span aria-hidden="true">T</span><span aria-hidden="true">H</span><span class="logo-gap" aria-hidden="true"></span><span aria-hidden="true">P</span><span aria-hidden="true">A</span><span aria-hidden="true">R</span><span aria-hidden="true">K</span></h1><div class="guide-subtitle">CHARACTER GUIDE</div><p class="guide-intro">Meet the residents of South Park. Browse character profiles, search by name, or discover someone at random.</p></div><div class="guide-search-row"><div class="guide-count" id="browseCount"></div><div class="guide-search-wrap"><span class="guide-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><circle cx="11" cy="11" r="6.75"></circle><path d="M16.1 16.1 21 21"></path></svg></span><input class="search-input guide-search-input" id="searchInput" type="search" placeholder="Search characters…" aria-label="Search characters"></div></div></div><div class="guide-hero-secondary"><button type="button" class="guide-surprise-button" id="randomCharacter">Random character</button></div></header><section class="season-strip" aria-label="Character categories"><div class="season-strip-heading"><div class="season-strip-title"><span>CATEGORIES</span><strong id="categoryStatus">All characters</strong></div><div class="season-strip-actions"><div class="view-toggle"><button class="view-button active" id="gridButton" aria-label="Grid view" title="Grid view">▦</button><button class="view-button" id="listButton" aria-label="List view" title="List view">☷</button></div></div></div><div class="category-rail" id="categoryRail"></div></section><section class="section archive-section"><div class="character-controls"><span class="character-count" id="resultsCount"></span></div><div class="character-grid" id="characterGrid"></div><nav class="pagination" id="pagination" aria-label="Character pages"></nav></section></div></main><div class="episode-modal" id="characterModal" role="dialog" aria-modal="true" aria-label="Character profile" aria-hidden="true"><div class="modal-panel"><div class="modal-topbar"><button class="modal-top-arrow" id="previousTop" aria-label="Previous character">‹</button><div class="modal-counter" id="modalCounter"></div><div class="modal-topbar-actions"><button class="modal-top-arrow" id="nextTop" aria-label="Next character">›</button><button class="modal-close" id="closeModal" aria-label="Close profile">×</button></div></div><div class="modal-scroll" id="modalScroll"><div class="character-modal-art" id="modalArt"></div><div class="modal-content"><div class="character-category" id="modalCategory"></div><h2 class="character-modal-name" id="modalName"></h2><div class="character-facts" id="modalFacts"></div><p class="character-bio" id="modalBio"></p><div class="modal-navigation"><button class="modal-nav" id="previousBottom"><span class="nav-circle">‹</span><span><small class="nav-label">Previous character</small><strong class="nav-title" id="previousName"></strong></span></button><button class="modal-nav next" id="nextBottom"><span><small class="nav-label">Next character</small><strong class="nav-title" id="nextName"></strong></span><span class="nav-circle">›</span></button></div></div></div></div></div><script>
const characters = [{"name": "Eric Cartman", "category": "Main", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "One of the four central boys, known for his outrageous schemes, selfishness and confrontational personality.", "hue": 25, "image": "images/characters/eric-cartman.png"}, {"name": "Stan Marsh", "category": "Main", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "A central member of the boys’ group, often serving as the voice of reason.", "hue": 210, "image": "images/characters/stan-marsh.png"}, {"name": "Kyle Broflovski", "category": "Main", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "Stan’s close friend, frequently at odds with Cartman.", "hue": 130, "image": "images/characters/kyle-broflovski.png"}, {"name": "Kenny McCormick", "category": "Main", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "Known for his orange parka, muffled speech and recurring deaths.", "hue": 30, "image": "images/characters/kenny-mccormick.png"}, {"name": "Butters Stotch", "category": "Students", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "An optimistic and trusting classmate who regularly gets caught up in other people’s plans.", "hue": 48, "image": "images/characters/butters-stotch.png"}, {"name": "Wendy Testaburger", "category": "Students", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "An outspoken and intelligent student at South Park Elementary.", "hue": 310, "image": "images/characters/wendy-testaburger.png"}, {"name": "Craig Tucker", "category": "Students", "firstAppearance": "Mr. Hankey, the Christmas Poo", "biography": "A deadpan classmate known for his dry personality.", "hue": 235, "image": "images/characters/craig-tucker.png"}, {"name": "Tweek Tweak", "category": "Students", "firstAppearance": "Gnomes", "biography": "An anxious and energetic student who is often overwhelmed by everyday events.", "hue": 60, "image": "images/characters/tweek-tweak.png"}, {"name": "Randy Marsh", "category": "Adults", "firstAppearance": "Volcano", "biography": "Stan’s father, whose impulsive decisions often cause chaos.", "hue": 195, "image": "images/characters/randy-marsh.png"}, {"name": "Sharon Marsh", "category": "Adults", "firstAppearance": "Volcano", "biography": "Stan’s mother and a more grounded member of the Marsh family.", "hue": 320, "image": "images/characters/sharon-marsh.png"}, {"name": "Mr. Garrison", "category": "School Staff", "firstAppearance": "Cartman Gets an Anal Probe", "biography": "A long-running teacher at South Park Elementary.", "hue": 170, "image": "images/characters/mr-garrison.png"}, {"name": "PC Principal", "category": "School Staff", "firstAppearance": "Stunning and Brave", "biography": "The school principal introduced in season nineteen.", "hue": 220, "image": "images/characters/pc-principal.png"}];
const categories=['All','Main','Students','Adults','School Staff'];
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='All',page=1,view='grid',current=null,visible=[],lastFocus=null;
const perPage=24;
function imageMarkup(c){return `<span class="fallback" aria-hidden="true">${escapeHTML(c.name.split(' ').map(x=>x[0]).join(''))}</span><img src="${escapeHTML(c.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`}
function filtered(){let q=$('searchInput').value.trim().toLowerCase();return characters.filter(c=>(selected==='All'||c.category===selected)&&(!q||[c.name,c.category,c.biography].some(v=>v.toLowerCase().includes(q))))}
function render(){visible=filtered();let pages=Math.max(1,Math.ceil(visible.length/perPage));page=Math.min(page,pages);$('browseCount').innerHTML=`<strong>${visible.length}</strong><span>CHARACTERS<br>FOUND</span>`;$('resultsCount').textContent=`${visible.length} ${visible.length===1?'character':'characters'} · Page ${page} of ${pages}`;$('categoryStatus').textContent=selected==='All'?'All characters':selected;$('categoryRail').innerHTML=categories.map(c=>`<button class="category-button ${c===selected?'active':''}" data-category="${escapeHTML(c)}" aria-pressed="${c===selected}">${escapeHTML(c)}</button>`).join('');$('characterGrid').classList.toggle('list-view',view==='list');$('gridButton').classList.toggle('active',view==='grid');$('listButton').classList.toggle('active',view==='list');$('characterGrid').innerHTML=visible.length?visible.slice((page-1)*perPage,page*perPage).map(c=>`<article class="character-card" role="button" tabindex="0" data-name="${escapeHTML(c.name)}" aria-label="Open ${escapeHTML(c.name)} profile"><div class="character-art" style="--hue:${c.hue}">${imageMarkup(c)}</div><div class="character-copy"><div class="character-category">${escapeHTML(c.category)}</div><h3>${escapeHTML(c.name)}</h3></div></article>`).join(''):'<div class="empty-state"><strong>No characters found</strong>Try another search or category.</div>';$('pagination').innerHTML=pages>1?`<button data-page="${page-1}" ${page===1?'disabled':''}>← Previous</button><span>${page} / ${pages}</span><button data-page="${page+1}" ${page===pages?'disabled':''}>Next →</button>`:''}
function openCharacter(name){let idx=visible.findIndex(c=>c.name===name);if(idx<0)return;current=idx;lastFocus=document.activeElement;showModal();$('characterModal').classList.add('active');$('characterModal').setAttribute('aria-hidden','false');document.body.classList.add('modal-open');$('closeModal').focus()}
function showModal(){let c=visible[current];$('modalArt').style.setProperty('--hue',c.hue);$('modalArt').innerHTML=imageMarkup(c);$('modalCategory').textContent=c.category;$('modalName').textContent=c.name;$('modalFacts').innerHTML=`<span><b>First appearance:</b> ${escapeHTML(c.firstAppearance)}</span>`;$('modalBio').textContent=c.biography;$('modalCounter').textContent=`${current+1} / ${visible.length}`;let prev=visible[current-1],next=visible[current+1];$('previousName').textContent=prev?.name||'Beginning';$('nextName').textContent=next?.name||'End';for(let id of ['previousTop','previousBottom'])$(id).disabled=!prev;for(let id of ['nextTop','nextBottom'])$(id).disabled=!next;$('modalScroll').scrollTop=0}
function move(delta){let n=current+delta;if(n>=0&&n<visible.length){current=n;showModal()}}
function closeModal(){$('characterModal').classList.remove('active');$('characterModal').setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');lastFocus?.focus()}
$('categoryRail').addEventListener('click',e=>{let b=e.target.closest('[data-category]');if(b){selected=b.dataset.category;page=1;render()}});$('searchInput').addEventListener('input',()=>{page=1;render()});$('gridButton').onclick=()=>{view='grid';render()};$('listButton').onclick=()=>{view='list';render()};$('pagination').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b&&!b.disabled){page=Number(b.dataset.page);render();$('characterGrid').scrollIntoView({block:'start',behavior:'smooth'})}});$('characterGrid').addEventListener('click',e=>{let card=e.target.closest('[data-name]');if(card)openCharacter(card.dataset.name)});$('characterGrid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-name]')){e.preventDefault();openCharacter(e.target.dataset.name)}});$('randomCharacter').onclick=()=>{selected='All';$('searchInput').value='';page=1;render();openCharacter(characters[Math.floor(Math.random()*characters.length)].name)};$('closeModal').onclick=closeModal;$('characterModal').addEventListener('click',e=>{if(e.target===$('characterModal'))closeModal()});for(let id of ['previousTop','previousBottom'])$(id).onclick=()=>move(-1);for(let id of ['nextTop','nextBottom'])$(id).onclick=()=>move(1);document.addEventListener('keydown',e=>{if(!$('characterModal').classList.contains('active'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});let startX=null;$('modalScroll').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('modalScroll').addEventListener('touchend',e=>{if(startX===null)return;let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>80)move(dx<0?1:-1);startX=null},{passive:true});render();
// Match the episode guide's individual-letter wobble and reset interaction.
const characterGuideLogo = document.getElementById('guideLogoReset');
function resetCharacterGuideFromLogo() {
  characterGuideLogo.classList.remove('logo-jump');
  void characterGuideLogo.offsetWidth;
  characterGuideLogo.classList.add('logo-jump');
  window.setTimeout(() => characterGuideLogo.classList.remove('logo-jump'), 420);
  selected = 'All';
  document.getElementById('searchInput').value = '';
  page = 1;
  view = 'grid';
  if (document.getElementById('characterModal').classList.contains('active')) closeModal();
  render();
}
characterGuideLogo.addEventListener('click', resetCharacterGuideFromLogo);
characterGuideLogo.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    resetCharacterGuideFromLogo();
  }
});
